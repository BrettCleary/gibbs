[project]
name = "alloyscience"
version = "0.1.0"
description = "Deterministic scientific core: Ising Monte Carlo, surrogates, uncertainty, thermodynamics, benchmarks"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloyscience"]
