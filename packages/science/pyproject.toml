[project]
name = "alloyscience"
version = "0.1.0"
description = "Deterministic scientific core: Ising Monte Carlo, surrogates, uncertainty, thermodynamics, benchmarks"
requires-python = ">=3.12"
dependencies = [
    "ase>=3.29.0",
    "icet>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloyscience"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:spglib",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    "ignore::DeprecationWarning:mchammer",
]
