[project]
name = "gibbs"
version = "0.1.0"
description = "Gibbs backend: campaigns, jobs, agent loop, API"
requires-python = ">=3.12"
dependencies = [
    "alloyscience",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "sse-starlette>=2.1",
    "temporalio>=1.32.0",
    "pydantic-ai>=2.35.0",
    "asyncpg>=0.29",
    "arize-otel>=0.13.0",
    "openinference-instrumentation-pydantic-ai>=0.1.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.uv.sources]
alloyscience = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gibbs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:spglib",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    "ignore::DeprecationWarning:mchammer",
]
