# Optional local PostgreSQL for the API.
# By default the API uses SQLite; to use Postgres instead:
#   docker compose -f infra/docker/docker-compose.yml up -d
#   export ALLOYLAB_DATABASE_URL=postgresql+asyncpg://gibbs:gibbs@localhost:5432/gibbs
#   uv sync --all-packages --extra postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gibbs
      POSTGRES_PASSWORD: gibbs
      POSTGRES_DB: gibbs
    ports:
      - "5432:5432"
    volumes:
      - gibbs_pgdata:/var/lib/postgresql/data

volumes:
  gibbs_pgdata:
