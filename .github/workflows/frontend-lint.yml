name: Frontend lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: prettier / typecheck / eslint (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck
        run: pnpm --filter @alloylab/web typecheck

      - name: ESLint
        run: pnpm --filter @alloylab/web lint
